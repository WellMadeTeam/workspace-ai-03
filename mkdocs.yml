site_name: Workspace for AI Collaboration
site_description: A shared whiteboard where a team asks a language model together and keeps every question and answer in one place.
site_url: https://wellmadeteam.github.io/workspace-ai-03/
repo_url: https://github.com/WellMadeTeam/workspace-ai-03

docs_dir: docs

# Study source material belongs in the private usability-data repository.
exclude_docs: |
  usability-tests/usability_test_transcript_sanitized.txt
  usability-tests/ut-01-events.json
  usability-tests/ut-01-notes.md
  usability-tests/ut-01-observability.json
  usability-tests/ut-01-posttest.csv

theme:
  name: readthedocs

nav:
