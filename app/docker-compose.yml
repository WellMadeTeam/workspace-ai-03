services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    volumes:
      - backend-data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    restart: unless-stopped

  # The only public entry point: /api goes to the backend, the rest to the frontend.
  nginx:
    image: nginx:1.29-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  backend-data:
