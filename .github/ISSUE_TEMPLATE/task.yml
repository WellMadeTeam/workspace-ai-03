name: Task
description: A task issue holds one unit of work, such as building part of a story, documentation, a report, or a workflow, and one pull request closes it.
labels: ["task"]
projects: ["workspace-ai-03/1"]
type: task
body:
  - type: markdown
    attributes:
      value: |
        A task issue holds one unit of work, such as building part of a story, documentation, a report, or a workflow, and one pull request closes it.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Description of unit of work, such as building part of a story, documentation, a report, or a workflow.
      placeholder: Run the Markdown format check and the lint on every pull request.
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: Story
      description: A bullet list with one item for each story issue that task works toward, because one task may serve several stories.
      placeholder: |
        - #42 (AC-01, AC-02)
    validations:
      required: false
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: A task's acceptance criteria are the checks that tell the reviewer whether the task is done. They may be narrower or more technical than the criteria of the story it works toward, because they check one unit of work rather than the whole need.
      value: |
        - [ ] AC-01: ...
    validations:
      required: true
