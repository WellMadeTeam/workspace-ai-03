name: Product code checks

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    frontend:
        runs-on: ubuntu-latest
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: "22.12"
                  cache: npm
                  cache-dependency-path: app/frontend/package-lock.json

            - name: Install frontend dependencies
              working-directory: app/frontend
              run: npm ci

            - name: Lint frontend
              working-directory: app/frontend
              run: npm run lint

            - name: Check frontend formatting
              working-directory: app/frontend
              run: npm run format:check

            - name: Type-check frontend
              working-directory: app/frontend
              run: npx tsc -b

            - name: Build frontend
              working-directory: app/frontend
              run: npx vite build

            - name: Test frontend
              working-directory: app/frontend
              run: npm test

    backend:
        runs-on: ubuntu-latest
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Python
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: "3.14"

            - name: Install backend dependencies
              run: python -m pip install -r app/backend/requirements.txt

            # Python backend linting, formatting, type-checking, and building
            # are not applicable because the repository configures no such checks.
            - name: Test backend
              env:
                  GROQ_API_KEY: ""
              run: python -m unittest discover -s app/backend/tests -t .
