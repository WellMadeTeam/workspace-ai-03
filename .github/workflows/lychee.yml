name: Link check

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    lychee:
        runs-on: ubuntu-latest
        env:
            LYCHEE_VERSION: v0.24.2
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            # lychee-action downloads lychee from the release's browser download
            # URL with one curl call, which fails the job with exit code 22 when
            # that URL answers 504; `gh` fetches the asset through the REST API.
            - name: Install lychee
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  file="lychee-x86_64-unknown-linux-gnu.tar.gz"
                  dir="${RUNNER_TEMP}/lychee"
                  mkdir -p "${dir}"
                  cd "${dir}"
                  for attempt in 1 2 3 4 5; do
                      gh release download "lychee-${LYCHEE_VERSION}" \
                          --repo lycheeverse/lychee \
                          --pattern "${file}" \
                          --pattern "${file}.sha256" \
                          --clobber && break
                      if [ "${attempt}" -eq 5 ]; then
                          exit 1
                      fi
                      sleep $((attempt * 10))
                  done
                  sha256sum -c "${file}.sha256"
                  tar -xzf "${file}" --strip-components=1
                  echo "${dir}" >> "${GITHUB_PATH}"
            - name: Check links
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  status=0
                  lychee --no-progress \
                      --max-concurrency 2 \
                      --accept 200,202,206,429 \
                      --format markdown \
                      --output "${RUNNER_TEMP}/lychee-report.md" \
                      './**/*.md' || status=$?
                  cat "${RUNNER_TEMP}/lychee-report.md"
                  cat "${RUNNER_TEMP}/lychee-report.md" >> "${GITHUB_STEP_SUMMARY}"
                  exit "${status}"
