name: Link check

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    lychee:
        runs-on: ubuntu-latest
        env:
            LYCHEE_VERSION: v0.24.2
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            # lychee-action downloads lychee with one curl call and no retries,
            # so a single HTTP error from the release fails the job with exit code 22.
            - name: Install lychee
              run: |
                  file="lychee-x86_64-unknown-linux-gnu.tar.gz"
                  url="https://github.com/lycheeverse/lychee/releases/download/lychee-${LYCHEE_VERSION}/${file}"
                  dir="${RUNNER_TEMP}/lychee"
                  mkdir -p "${dir}"
                  cd "${dir}"
                  curl -sSfL --retry 5 --retry-all-errors --retry-delay 10 -O "${url}" -O "${url}.sha256"
                  sha256sum -c "${file}.sha256"
                  tar -xzf "${file}" --strip-components=1
                  echo "${dir}" >> "${GITHUB_PATH}"
            - name: Check links
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  status=0
                  lychee --no-progress \
                      --max-concurrency 2 \
                      --accept 200,202,206,429 \
                      --format markdown \
                      --output "${RUNNER_TEMP}/lychee-report.md" \
                      './**/*.md' || status=$?
                  cat "${RUNNER_TEMP}/lychee-report.md"
                  cat "${RUNNER_TEMP}/lychee-report.md" >> "${GITHUB_STEP_SUMMARY}"
                  exit "${status}"
